version: v1
features:
  healing:
    description: 視聴者に与える癒し、安心、落ち着き。明るい・可愛いだけでは高くせず、継続的な緊張は低くする。
    criteria:
      - 緊張や刺激が非常に強く、落ち着けない
      - 緊張が多く、癒しは少ない
      - 緊張と安心が同程度
      - 安心や落ち着きが中心
      - 継続して非常に強い安心や癒しを与える
  cognitive_load:
    description: 理解・記憶・考察の負荷。0は気楽、1は高負荷。
    criteria:
      - 考えずに理解できる
      - 少しの注意で理解できる
      - 通常の注意や記憶が必要
      - 複雑な関係や設定を理解する必要がある
      - 非常に複雑で継続的な考察が必要
  seriousness:
    description: 作品のシリアスさ。0は軽い、1は重い。
    criteria:
      - 非常に軽く、深刻な展開はほぼない
      - 軽い展開が多い
      - 軽さと深刻さが同程度
      - 深刻な展開が中心
      - 非常に重い問題や展開が中心
  world_building:
    description: 世界観・舞台が作品体験で重要な度合い。
    criteria:
      - 舞台や世界の設定はほぼ重要でない
      - 設定は背景にとどまる
      - 設定が作品体験の一部を担う
      - 世界観や舞台の理解が重要
      - 世界観や舞台への没入が作品体験の中心
  character_focus:
    description: キャラクターの関係・魅力が作品体験の中心にある度合い。
    criteria:
      - キャラクターの関係や魅力はほぼ中心でない
      - キャラクターより他の要素が中心
      - キャラクターと他の要素が同程度
      - キャラクターの関係や魅力が中心
      - キャラクターの関係や魅力を楽しむことがほぼ全体を占める
  travel:
    description: 旅・移動・土地・地域性が作品体験の中心にある度合い。舞台があるだけでは高くしない。
    criteria:
      - 旅や土地性はほぼない
      - 移動や土地性は背景にとどまる
      - 旅や地域性が一部にある
      - 旅や土地との関わりが重要
      - 旅・移動・地域性が作品体験の中心
